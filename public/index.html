<!DOCTYPE html>
<html lang="fi">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <link rel="icon" href="<%= BASE_URL %>logo.ico" />
  <title>
    <%= htmlWebpackPlugin.options.title %>
  </title>
  <meta name="description"
    content="Koe aito vietnamilainen maku keskellä Turkua. Tarjoamme herkullista buffettia lounasaikaan, ystävällistä palvelua ja ainutlaatuisen kulttuurikokemuksen. Tervetuloa nauttimaan!" />
</head>

<body>
  <noscript>
    <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work
        properly without JavaScript enabled. Please enable it to
        continue.</strong>
  </noscript>
  <!-- Vue replaces these links with the footer's own when it mounts. They are here so the links are in the HTML every
    route is served, for crawlers and visitors that do not run JavaScript. -->
  <div id="app">
    <p style="position: fixed; bottom: 1rem; left: 1rem; margin: 0; font: 14px sans-serif">
      <a href="https://www.oivahymy.fi/yrityshaku?hakusana=Kimin%20Ravintola%20Turku" target="_blank"
        rel="noopener">Oiva-raportti</a>
      · Verkkosivut: <a href="https://koodimo.fi" target="_blank" rel="noopener">Koodimo</a>
    </p>
  </div>
  <!-- built files will be auto injected -->
</body>

</html>
